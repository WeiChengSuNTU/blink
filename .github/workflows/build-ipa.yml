name: Build Unsigned Blink IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Latest Xcode (Xcode 26+)
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode.app 2>/dev/null | sort -V | tail -n 1)
          echo "Using Xcode at: $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          xcodebuild -version

      - name: Fetch precompiled frameworks and resources
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x get_frameworks.sh get_resources.sh
          ./get_frameworks.sh
          ./get_resources.sh
          rm -rf Blink.xcodeproj/project.xcworkspace/xcshareddata/

      - name: Setup config and strip paid entitlements
        run: |
          cp template_setup.xcconfig developer_setup.xcconfig
          find . -name "*.entitlements" -exec plutil -remove com.apple.developer.icloud-container-identifiers {} \; 2>/dev/null || true
          find . -name "*.entitlements" -exec plutil -remove com.apple.developer.icloud-services {} \; 2>/dev/null || true
          find . -name "*.entitlements" -exec plutil -remove com.apple.developer.ubiquity-kvstore-identifier {} \; 2>/dev/null || true
          find . -name "*.entitlements" -exec plutil -remove aps-environment {} \; 2>/dev/null || true
          find . -name "*.entitlements" -exec plutil -remove keychain-access-groups {} \; 2>/dev/null || true
          find . -name "*.entitlements" -exec plutil -remove com.apple.developer.siri {} \; 2>/dev/null || true

      - name: Build and Archive (Unsigned)
        run: |
          xcodebuild archive \
            -project Blink.xcodeproj \
            -scheme Blink \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/Blink.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/Blink.xcarchive/Products/Applications/Blink.app build/Payload/
          cd build
          zip -qr Blink-unsigned.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blink-unsigned-ipa
          path: build/Blink-unsigned.ipa
